<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Coffee House</title>
    <link rel="stylesheet" href="./css/cart.css" />
  </head>
  <body>
    <div class="container">
      <div id="navbar">
        <a href="./index.html" class="logo">
          <img
            src="./assets/icons/logo.svg"
            alt="logo"
            width="100px"
            height="60px"
          />
        </a>

        <!-- Desktop menu -->
        <nav>
          <a href="#carousel">Favorite coffee</a>
          <a href="#about">About</a>
          <a href="#mobile">Mobile app</a>
          <a href="#footer">Contact us</a>
        </nav>

        <button id="menu-btn">
          <a href="./menu.html">
            <p>Menu</p>
            <img
              src="./assets/icons/coffee-cup.svg"
              alt=""
              width="20px"
              height="20px"
            />
          </a>
        </button>

        <!-- Hamburger icon (visible on mobile) -->
        <img
          id="hamburger"
          src="./assets/icons/BurgerIcon.svg"
          alt="logo"
          width="44px"
          height="44px"
        />
      </div>

      <!-- Fullscreen mobile menu -->
      <div id="mobile-menu">
        <div id="menu-logo">
          <a href="./index.html" class="logo">
            <img
              src="./assets/icons/logo.svg"
              alt="logo"
              width="100px"
              height="60px"
            /> </a
          ><img
            id="close-menu"
            src="./assets/icons/Xicon.svg"
            alt="close-icon"
            width="44px"
            height="44px"
          />
        </div>
        <div id="menu-navbar">
          <a href="#carousel">Favorite coffee</a>
          <a href="#about">About</a>
          <a href="#mobile">Mobile app</a>
          <a href="#footer">Contact us</a>
          <a href="./menu.html" class="mobile-menu-link">
            Menu
            <img
              src="./assets/icons/coffee-cup.svg"
              width="40px"
              height="40px"
            />
          </a>
        </div>
      </div>

      <script>
        const hamburger = document.getElementById("hamburger");
        const mobileMenu = document.getElementById("mobile-menu");
        const closeMenu = document.getElementById("close-menu");

        hamburger.addEventListener("click", () => {
          mobileMenu.style.display = "flex";
        });

        closeMenu.addEventListener("click", () => {
          mobileMenu.style.display = "none";
        });

        // Optional: Close when clicking a link
        document.querySelectorAll("#mobile-menu a").forEach((link) => {
          link.addEventListener("click", () => {
            mobileMenu.style.display = "none";
          });
        });
      </script>

      <!-- Cart item -->

      <div>
        <h2 id="title">Cart</h2>
        <div id="cart-items">
          <!-- Items will be inserted here dynamically -->
        </div>
        <div id="total">
          <h2>Total:</h2>
          <p id="total-price">$0.00</p>
        </div>
        <div id="login-btns">
          <button id="signin"><a href="./signIn.html">Sign In</a></button>
          <button id="registration">
            <a href="./registration.html">Registration</a>
          </button>
        </div>
        <div id="confirm">
          <button id="confirm-order" style="display: none">
            Confirm Order
          </button>
        </div>
      </div>

      <footer id="footer">
        <div>
          <h1>
            Sip, Savor, Smile. <br /><span class="favorite"
              >It’s coffee time!</span
            >
          </h1>
          <div class="social-media">
            <img
              src="./assets/icons/tweeter.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/instagram.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/facebook.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            />
          </div>
        </div>
        <div class="contact">
          <h2>Contact us</h2>
          <ul>
            <li>
              <img
                src="./assets/icons/pin-alt.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              8558 Green Rd., LA
            </li>
            <li>
              <img
                src="./assets/icons/phone.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              +1 (603) 555-0123
            </li>
            <li>
              <img
                src="./assets/icons/clock.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              Mon-Sat: 9:00 AM – 23:00 PM
            </li>
          </ul>
        </div>
      </footer>
    </div>
    <script src="./dist/cart.js" defer></script>
  </body>
</html>
