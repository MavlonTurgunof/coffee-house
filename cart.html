<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Coffee House</title>
    <link rel="stylesheet" href="./css/cart.css" />
  </head>
  <body>
    <div class="container">
      <div id="navbar">
        <a href="./index.html">
          <img src=" /assets/icons/logo.svg" alt="" width="100px" height="60px"
        /></a>
        <nav>
          <a href="#">Favourite coffee</a>
          <a href="#">About</a>
          <a href="#">Mobile app</a>
          <a href="#">Contact us</a>
        </nav>
        <button id="menu-btn">
          <a href=" /menu.html">
            <p>Menu</p>
            <img
              src=" /assets/icons/coffee-cup.svg"
              alt=""
              width="20px"
              height="20px"
          /></a>
        </button>
      </div>

      <!-- Cart item -->

      <div>
        <h2 id="title">Cart</h2>
        <div id="cart-items">
          <div class="cart-item">
            <div class="cart-item-left">
              <img
                src="./assets/icons/trash.svg"
                alt="delete"
                width="24px"
                height="24px"
              />
              <img
                src="./assets/images/menu/dessert-1.svg"
                alt="item"
                width="100px"
                height="100px"
                class="cart-item-pic"
              />
              <div class="cart-item-name">
                <h2>Marble cheesecake</h2>
                <p>50g, Berries, Nuts</p>
              </div>
            </div>
            <h2 class="cart-item-price">$3.50</h2>
          </div>
          <div id="total">
            <h2>Total:</h2>
            <p>$3.50</p>
          </div>
          <div id="login-btns">
            <button id="signin"><a href="/signIn.html">Sign In</a></button>
            <button id="registration">
              <a href="/registration.html">Registration</a>
            </button>
          </div>
        </div>
      </div>

      <footer id="footer">
        <div>
          <h1>
            Sip, Savor, Smile. <br /><span class="favorite"
              >It’s coffee time!</span
            >
          </h1>
          <div class="social-media">
            <img
              src="./assets/icons/tweeter.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/instagram.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/facebook.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            />
          </div>
        </div>
        <div class="contact">
          <h2>Contact us</h2>
          <ul>
            <li>
              <img
                src="./assets/icons/pin-alt.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              8558 Green Rd., LA
            </li>
            <li>
              <img
                src="./assets/icons/phone.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              +1 (603) 555-0123
            </li>
            <li>
              <img
                src="./assets/icons/clock.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              Mon-Sat: 9:00 AM – 23:00 PM
            </li>
          </ul>
        </div>
      </footer>
    </div>
    <script type="module" src=" /js/menu.js"></script>
  </body>
</html>
