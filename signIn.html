<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-In | Coffee House</title>
    <link rel="stylesheet" href="./css/registration.css" />
  </head>
  <body>
    <div class="container">
      <div id="navbar">
        <a href="./index.html">
          <img src=" /assets/icons/logo.svg" alt="" width="100px" height="60px"
        /></a>
        <nav>
          <a href="#">Favourite coffee</a>
          <a href="#">About</a>
          <a href="#">Mobile app</a>
          <a href="#">Contact us</a>
        </nav>
        <button id="menu-btn">
          <a href=" /menu.html">
            <p>Menu</p>
            <img
              src=" /assets/icons/coffee-cup.svg"
              alt=""
              width="20px"
              height="20px"
          /></a>
        </button>
      </div>

      <section>
        <h1>Sign In</h1>
        <form id="signin-form">
          <div class="form-row single-column">
            <div class="form-group">
              <label for="login">Login</label>
              <input type="text" id="login" placeholder="Placeholder" />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Placeholder" />
            </div>
          </div>

          <button type="submit" class="btn">Sign In</button>
        </form>
      </section>
      <footer id="footer">
        <div>
          <h1>
            Sip, Savor, Smile. <br /><span class="favorite"
              >It’s coffee time!</span
            >
          </h1>
          <div class="social-media">
            <img
              src="./assets/icons/tweeter.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/instagram.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/facebook.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            />
          </div>
        </div>
        <div class="contact">
          <h2>Contact us</h2>
          <ul>
            <li>
              <img
                src="./assets/icons/pin-alt.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              8558 Green Rd., LA
            </li>
            <li>
              <img
                src="./assets/icons/phone.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              +1 (603) 555-0123
            </li>
            <li>
              <img
                src="./assets/icons/clock.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              Mon-Sat: 9:00 AM – 23:00 PM
            </li>
          </ul>
        </div>
      </footer>
    </div>
    <script src="./dist/signIn.js"></script>
  </body>
</html>
