<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration | Coffee House</title>
    <link rel="stylesheet" href="./css/registration.css" />
  </head>
  <body>
    <div class="container">
      <div id="navbar">
        <a href="./index.html" class="logo">
          <img
            src="./assets/icons/logo.svg"
            alt="logo"
            width="100px"
            height="60px"
          />
        </a>

        <!-- Desktop menu -->
        <nav>
          <a href="#carousel">Favorite coffee</a>
          <a href="#about">About</a>
          <a href="#mobile">Mobile app</a>
          <a href="#footer">Contact us</a>
        </nav>

        <button id="menu-btn">
          <a href="./menu.html">
            <p>Menu</p>
            <img
              src="./assets/icons/coffee-cup.svg"
              alt=""
              width="20px"
              height="20px"
            />
          </a>
        </button>

        <!-- Hamburger icon (visible on mobile) -->
        <img
          id="hamburger"
          src="./assets/icons/BurgerIcon.svg"
          alt="logo"
          width="44px"
          height="44px"
        />
      </div>

      <!-- Fullscreen mobile menu -->
      <div id="mobile-menu">
        <div id="menu-logo">
          <a href="./index.html" class="logo">
            <img
              src="./assets/icons/logo.svg"
              alt="logo"
              width="100px"
              height="60px"
            /> </a
          ><img
            id="close-menu"
            src="/assets/icons/Xicon.svg"
            alt="close-icon"
            width="44px"
            height="44px"
          />
        </div>
        <div id="menu-navbar">
          <a href="#carousel">Favorite coffee</a>
          <a href="#about">About</a>
          <a href="#mobile">Mobile app</a>
          <a href="#footer">Contact us</a>
          <a href="./menu.html" class="mobile-menu-link">
            Menu
            <img
              src="./assets/icons/coffee-cup.svg"
              width="40px"
              height="40px"
            />
          </a>
        </div>
      </div>

      <script>
        const hamburger = document.getElementById("hamburger");
        const mobileMenu = document.getElementById("mobile-menu");
        const closeMenu = document.getElementById("close-menu");

        hamburger.addEventListener("click", () => {
          mobileMenu.style.display = "flex";
        });

        closeMenu.addEventListener("click", () => {
          mobileMenu.style.display = "none";
        });

        // Optional: Close when clicking a link
        document.querySelectorAll("#mobile-menu a").forEach((link) => {
          link.addEventListener("click", () => {
            mobileMenu.style.display = "none";
          });
        });
      </script>

      <!-- Registration -->
      <section>
        <h1>Registration</h1>
        <form id="registration-form">
          <div class="form-row">
            <div class="form-group">
              <label for="login">Login</label>
              <input type="text" id="login" placeholder="Placeholder" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Placeholder" />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>
              <input
                type="password"
                id="confirm-password"
                placeholder="Placeholder"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" placeholder="Placeholder" />
            </div>
            <div class="form-group">
              <label for="street">Street</label>
              <input type="text" id="street" placeholder="Placeholder" />
            </div>
            <div class="form-group">
              <label for="house-number">House number</label>
              <input type="text" id="house-number" placeholder="Placeholder" />
            </div>
          </div>

          <div class="form-row pay-row">
            <label>Pay by</label>
            <div class="radio-group">
              <label
                ><input type="radio" name="pay" value="cash" checked />
                Cash</label
              >
              <label><input type="radio" name="pay" value="card" /> Card</label>
            </div>
          </div>

          <button type="submit" class="btn">Registration</button>
        </form>
      </section>

      <footer id="footer">
        <div>
          <h1>
            Sip, Savor, Smile. <br /><span class="favorite"
              >It’s coffee time!</span
            >
          </h1>
          <div class="social-media">
            <img
              src="./assets/icons/tweeter.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/instagram.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/facebook.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            />
          </div>
        </div>
        <div class="contact">
          <h2>Contact us</h2>
          <ul>
            <li>
              <img
                src="./assets/icons/pin-alt.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              8558 Green Rd., LA
            </li>
            <li>
              <img
                src="./assets/icons/phone.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              +1 (603) 555-0123
            </li>
            <li>
              <img
                src="./assets/icons/clock.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              Mon-Sat: 9:00 AM – 23:00 PM
            </li>
          </ul>
        </div>
      </footer>
    </div>
    <script src="./dist/registration.js"></script>
  </body>
</html>
