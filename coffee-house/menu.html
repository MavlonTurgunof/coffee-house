<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Menu | Coffee House</title>
    <link rel="stylesheet" href="./css/menu.css" />
  </head>
  <body>
    <div class="container">
      <div id="navbar">
        <a href="./index.html">
          <img
            src="/coffee-house/assets/icons/logo.svg"
            alt=""
            width="100px"
            height="60px"
        /></a>
        <nav>
          <a href="#">Favourite coffee</a>
          <a href="#">About</a>
          <a href="#">Mobile app</a>
          <a href="#">Contact us</a>
        </nav>
        <button id="menu-btn">
          <a href="/coffee-house/menu.html">
            <p>Menu</p>
            <img
              src="/coffee-house/assets/icons/coffee-cup.svg"
              alt=""
              width="20px"
              height="20px"
          /></a>
        </button>
      </div>

      <header class="menu-header">
        <h1>
          Behind each of our cups <br />
          hides an
          <span class="favorite"> amazing surprise</span>
        </h1>
      </header>

      <section class="filter-bar">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="coffee">
          <img
            src="./assets/icons/coffee.png"
            alt="coffee"
            width="30px"
            height="30px"
          />Coffee
        </button>
        <button class="filter-btn" data-category="tea">
          <img
            src="./assets/icons/teapot.png"
            alt="coffee"
            width="30px"
            height="30px"
          />Tea
        </button>
        <button class="filter-btn" data-category="dessert">
          <img
            src="./assets/icons/dessert.png"
            alt="coffee"
            width="30px"
            height="30px"
          />Dessert
        </button>
      </section>

      <section id="menu-grid" class="menu-grid">
        <!-- Cards will be generated by JS -->
      </section>
      <footer id="footer">
        <div>
          <h1>
            Sip, Savor, Smile. <br /><span class="favorite"
              >It’s coffee time!</span
            >
          </h1>
          <div class="social-media">
            <img
              src="./assets/icons/tweeter.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/instagram.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            /><img
              src="./assets/icons/facebook.svg"
              alt="tweeter"
              width="60px"
              height="60px"
            />
          </div>
        </div>
        <div class="contact">
          <h2>Contact us</h2>
          <ul>
            <li>
              <img
                src="./assets/icons/pin-alt.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              8558 Green Rd., LA
            </li>
            <li>
              <img
                src="./assets/icons/phone.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              +1 (603) 555-0123
            </li>
            <li>
              <img
                src="./assets/icons/clock.svg"
                alt="pin"
                width="20px"
                height="20px"
              />
              Mon-Sat: 9:00 AM – 23:00 PM
            </li>
          </ul>
        </div>
      </footer>
    </div>

    <script type="module" src="/coffee-house/js/menu.js"></script>

    <!-- Modal -->
    <div id="menuModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        <div class="modal-left">
          <img id="modalImage" src="" alt="coffee" />
        </div>
        <div class="modal-right">
          <h2 id="modalName"></h2>
          <p id="modalDescription"></p>

          <div class="size-section">
            <h4>Size</h4>
            <div id="sizeOptions" class="option-group"></div>
          </div>

          <div class="additives-section">
            <h4>Additives</h4>
            <div id="additivesOptions" class="option-group"></div>
          </div>

          <div class="price-section">
            <p>Total:</p>
            <p><span id="modalPrice"></span></p>
          </div>

          <button id="closeButton" class="close-button">Close</button>
        </div>
      </div>
    </div>
  </body>
</html>
